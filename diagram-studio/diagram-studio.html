<!doctype html>
<html lang="ja">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d4fc2'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'%3E%3Crect x='5' y='6' width='10' height='7' rx='1.5'/%3E%3Crect x='17' y='19' width='10' height='7' rx='1.5'/%3E%3Cpath d='M10 13v9.5h6'/%3E%3C/g%3E%3Cpath fill='%23fff' d='M15.5 20l3 2.5-3 2.5z'/%3E%3C/svg%3E">
<style>
[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f5f7;--panel:#ffffff;--panel2:#eceef2;--line:#dcdfe6;--text:#1f2430;--muted:#667085;
  --accent:#6d4fc2;--accent-soft:#ece8fb;--danger:#b42318;--hover:#e6e8ee;--canvas:#e9ebef;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181e;--panel:#1c2027;--panel2:#242933;--line:#323844;--text:#e3e6ec;--muted:#98a1b2;
  --accent:#a68df0;--accent-soft:#2e2650;--danger:#f97066;--hover:#2b313c;--canvas:#101318;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);overflow:hidden;font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;display:grid;grid-template-rows:44px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
header{display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:700;margin:0 12px 0 6px;white-space:nowrap}.brand b{color:var(--accent)}
.tb{height:32px;min-width:32px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--hover)}
.tb:disabled{opacity:.35;cursor:default}
.tb.on{background:var(--accent-soft);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 5px;flex:none}
.grow{flex:1}
#zoomLabel{min-width:52px;font-variant-numeric:tabular-nums}
main{display:flex;min-height:0;min-width:0}
#sidebar{width:var(--sidebar-w,250px);flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
body.no-sidebar #sidebar,body.no-sidebar #resizer{display:none}
#resizer{width:5px;flex:none;cursor:col-resize;background:var(--line);background-clip:content-box;padding:0 2px}
#resizer:hover{background:var(--accent);padding:0 1px}
.side-head{height:34px;display:flex;align-items:center;gap:2px;padding:0 6px 0 12px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.side-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .tb{height:26px;min-width:26px;padding:0}
#tree{flex:1;overflow:auto;padding:4px 0 24px;min-height:0;user-select:none}
#tree.drop-root{box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:flex;align-items:center;gap:5px;height:26px;padding-right:8px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft);color:var(--accent)}
.row.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.row.other{color:var(--muted)}
.row .tw{width:14px;display:flex;justify-content:center;color:var(--muted)}
.row .tw svg{width:12px;height:12px;transition:transform .1s}
.row.open .tw svg{transform:rotate(90deg)}
.row svg.i{width:15px;height:15px}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.ic-dir{color:#c99a2e}.ic-img{color:#2e9e5b}.ic-dg{color:var(--accent)}.ic-file{color:var(--muted)}
.side-empty{padding:18px 14px;color:var(--muted)}
#workspace{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;height:34px;flex:none;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;max-width:240px;border-right:1px solid var(--line);cursor:pointer;color:var(--muted);flex:none}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.tab.dirty .dot{visibility:visible}
.tab .x{width:20px;height:20px;padding:0;border:0;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit}
.tab .x:hover{background:var(--hover)}
.tab .x svg{width:12px;height:12px}
#body{flex:1;display:flex;min-height:0}
/* 図形の一覧 */
#palette{width:150px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 8px 20px}
#palette h3{font-size:11px;color:var(--muted);margin:10px 2px 4px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pal button{height:40px;padding:3px;border:1px solid transparent;border-radius:6px;background:none;cursor:grab;display:flex;align-items:center;justify-content:center}
.pal button:hover{background:var(--hover);border-color:var(--line)}
.pal svg{width:34px;height:28px;overflow:visible}
/* キャンバス */
#stage{flex:1;position:relative;min-width:0;background:var(--canvas);overflow:hidden}
#canvas:focus,#canvas:focus-visible{outline:0}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
#canvas.panning{cursor:grabbing}
#canvas.space{cursor:grab}
#viewer{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;outline:0;background-color:#fff;background-image:linear-gradient(45deg,#eceef2 25%,transparent 25%,transparent 75%,#eceef2 75%),linear-gradient(45deg,#eceef2 25%,transparent 25%,transparent 75%,#eceef2 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#viewer.panning{cursor:grabbing}
#viewer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
body.viewing #palette{display:none}
#props dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
#props dt{color:var(--muted)}#props dd{margin:0;overflow-wrap:anywhere}
#editor{position:absolute;z-index:5;margin:0;padding:4px;border:2px solid var(--accent);border-radius:4px;background:#fff;color:#1f2430;resize:none;outline:0;text-align:center;overflow:hidden;line-height:1.3}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.placeholder h1{margin:0;font-size:22px;color:var(--text)}
.placeholder p{margin:0;max-width:460px}
/* 書式パネル */
#props{width:220px;flex:none;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px 20px}
#props h3{font-size:12px;margin:12px 0 6px;color:var(--muted)}
#props h3:first-child{margin-top:0}
#props .none{color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw button{width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;cursor:pointer}
.sw button.on{outline:2px solid var(--text);outline-offset:1px}
.sw button.nofill{background:linear-gradient(135deg,#fff 45%,#e5484d 47%,#e5484d 53%,#fff 55%)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#props label.ck{display:flex;align-items:center;gap:6px;margin-top:6px}
#props select{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px}
#props .btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
#props .btns button{flex:1;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer;white-space:nowrap}
#props .btns button:hover{background:var(--hover)}
#props input.txt{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:0 8px;min-width:0}
#props input.txt:focus{border-color:var(--accent);outline:0}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;flex-direction:column;gap:3px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.drow select{height:26px!important;font-size:12px}
.dline{display:flex;gap:4px}
.dline .x{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}
.dline .x:hover{color:var(--danger);border-color:var(--danger)}
#props p.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
/* メニュー・モーダル・通知 */
#ctx{position:fixed;z-index:40;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#ctx button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:0;border-radius:4px;background:none;cursor:pointer;text-align:left}
#ctx button:hover,#ctx button:focus-visible{background:var(--hover);outline:0}
#ctx button.danger{color:var(--danger)}
#ctx button kbd{margin-left:auto;color:var(--muted);font:11px system-ui,sans-serif}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal h2{font-size:15px;margin:0;padding:14px 18px 10px}
.modal .mb{padding:2px 18px 12px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.modal .mf{padding:10px 18px 14px;display:flex;justify-content:flex-end;gap:8px}
.modal label{color:var(--muted);font-size:12px}
.modal input[type=text]{width:100%;height:34px;padding:0 10px;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;outline:0}
.modal input[type=text]:focus{border-color:var(--accent)}
.btn{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.sc-table{width:100%;border-collapse:collapse}
.sc-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.sc-table td:last-child{text-align:right;white-space:nowrap}
kbd{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--text);color:var(--panel);padding:7px 14px;border-radius:7px;max-width:70vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast div.err{background:var(--danger);color:#fff}
</style>
</head>
<body>
<header>
  <div class="brand">Diagram <b>Studio</b></div>
  <button class="tb" data-cmd="sidebar"></button>
  <button class="tb" data-cmd="openFolder"></button>
  <button class="tb" data-cmd="save"></button>
  <i class="sep"></i>
  <button class="tb" data-cmd="undo"></button>
  <button class="tb" data-cmd="redo"></button>
  <i class="sep"></i>
  <button class="tb" data-cmd="front"></button>
  <button class="tb" data-cmd="back"></button>
  <button class="tb" data-cmd="remove"></button>
  <i class="sep"></i>
  <button class="tb" data-cmd="zoomOut"></button>
  <span id="zoomLabel" class="tb" aria-live="polite">100%</span>
  <button class="tb" data-cmd="zoomIn"></button>
  <button class="tb" data-cmd="fit"></button>
  <button class="tb" data-cmd="snap"></button>
  <span class="grow"></span>
  <button class="tb" data-cmd="svg"></button>
  <button class="tb" data-cmd="png"></button>
  <button class="tb" data-cmd="theme"></button>
  <button class="tb" data-cmd="help"></button>
</header>
<main>
  <aside id="sidebar">
    <div class="side-head"><span id="rootName">エクスプローラー</span><button class="tb" id="refresh" title="フォルダを再読み込み"></button></div>
    <div id="tree" tabindex="-1"></div>
  </aside>
  <div id="resizer" role="separator" aria-orientation="vertical" title="ドラッグで幅を変更"></div>
  <section id="workspace">
    <div id="tabs"></div>
    <div id="body">
      <nav id="palette" aria-label="図形"></nav>
      <div id="stage">
        <svg id="canvas" tabindex="0" aria-label="キャンバス"></svg>
        <textarea id="editor" hidden spellcheck="false" aria-label="文字の編集"></textarea>
        <div id="viewer" hidden tabindex="0" aria-label="画像"><img alt=""></div>
        <div class="placeholder" id="empty"></div>
      </div>
      <aside id="props" aria-label="書式"></aside>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);

const ICONS = {
  menu: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  folderOpen: '<path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/><path d="M3 19l2.4-8.5A2 2 0 0 1 7.3 9H21l-2.3 8.5a2 2 0 0 1-2 1.5H5a2 2 0 0 1-2-2V8"/>',

  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',

  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',

  plusDir: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/>',
  rename: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
function toast(msg, err) { const d = el('div', err ? 'err' : '', msg); $('#toast').append(d); setTimeout(() => d.remove(), err ? 6000 : 2800); }
function fail(e) {
  console.error(e);
  const m = e && e.name === 'NotAllowedError' ? 'フォルダへのアクセス権限がありません。フォルダを開き直してください。' : (e && e.message) || String(e);
  toast('エラー: ' + m, true);

const z2 = (n) => String(n).padStart(2, '0');

const state = {
  root: null, tabs: [], active: null, expanded: new Set(), modal: null, drag: null,
  theme: store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  snap: store.get('snap', true), clipboard: null, pasteCount: 0,

  return close;

const button = (label, cls, onClick) => { const b = el('button', 'btn ' + (cls || ''), label); b.type = 'button'; b.onclick = onClick; return b; };

/* ---------- タブ ---------- */
async function openFile(node) {
  if (!node) return;
  let t = state.tabs.find((x) => x.path === node.path);
  if (!t) {
    const f = await node.handle.getFile();
    if (imageType(node.name)) {
      t = { kind: 'image', path: node.path, name: node.name, handle: node.handle, mtime: f.lastModified, dirty: false, past: [], future: [], sel: new Set(), view: null };
      await loadImage(t, f);
      state.tabs.push(t);
      activate(t);
      fitView();
      return;
    }
    if (f.size > 20 * 1024 * 1024) { toast('20MB を超えるファイルは開けません', true); return; }
    const doc = parseDiagram(await f.text());
    const snap = JSON.stringify(doc);
    t = { path: node.path, name: node.name, handle: node.handle, mtime: f.lastModified, doc, snap, saved: snap, dirty: false, past: [], future: [], sel: new Set(), view: null, hover: null };
    state.tabs.push(t);
    activate(t);
    fitView();
    return;
  }
  activate(t);
}
/** 画像を読み込み、表示用の blob URL と大きさを用意する。読めなければ例外にする */
async function loadImage(t, f) {
  if (f.size > 100 * 1024 * 1024) throw new Error('100MB を超える画像は開けません');
  const url = URL.createObjectURL(new Blob([f], { type: imageType(t.name) })); // 拡張子から種類を決める(SVG を確実に画像として扱う)

  img.src = url;
  try { await img.decode(); } catch { URL.revokeObjectURL(url); throw new Error(`「${t.name}」を画像として表示できません`); }
  if (t.url) URL.revokeObjectURL(t.url);
  Object.assign(t, { url, w: img.naturalWidth || 300, h: img.naturalHeight || 150, size: f.size, mtime: f.lastModified });
}
function activate(t) {

  state.active = t;
  if (t && !t.view) { const r = canvas.getBoundingClientRect(); t.view = { x: r.width / 2, y: r.height / 2, k: 1 }; }
  renderTabs(); renderTree(); renderCanvas();
  if (t) (t.kind === 'image' ? $('#viewer') : canvas).focus();
}
function renderTabs() {
  const box = $('#tabs'), frag = document.createDocumentFragment();
  for (const t of state.tabs) {
    const d = el('div', 'tab' + (t === state.active ? ' on' : '') + (t.dirty ? ' dirty' : ''));
    d.title = t.path;
    d.innerHTML = `<span class="tn">${esc(isDiagram(t.name) ? t.name.slice(0, -EXT.length) : t.name)}</span><i class="dot" title="未保存"></i><button class="x" type="button" title="閉じる" aria-label="閉じる">${icon('x')}</button>`;
    d.addEventListener('click', (e) => { if (e.target.closest('.x')) guard(closeTab)(t); else if (t !== state.active) activate(t); });
    d.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); guard(closeTab)(t); } });
    frag.append(d);
  }
  box.replaceChildren(frag);

}
function dropTab(t) {

  state.tabs.splice(i, 1);
  if (t.url) URL.revokeObjectURL(t.url);

      buttons: [{ label: 'キャンセル', value: null }, { label: '保存しない', value: 'discard', kind: 'danger' }, { label: '保存する', value: 'save', kind: 'primary' }],

/* ---------- 書き出し ---------- */
/** 図と同じフォルダに、同じ名前の .svg / .png を書き出す */
async function exportTo(kind) {
  const t = state.active; if (!t || !t.doc) { toast('図を開いてください', true); return; }
  if (!t.doc.nodes.length) { toast('図形がありません', true); return; }
  const dir = findNode(dirOf(t.path)); if (!dir) throw new Error('保存先のフォルダが見つかりません');
  const name = t.name.slice(0, -EXT.length) + '.' + kind, svg = exportSvg(t.doc);
  let data = svg;
  if (kind === 'png') {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const scale = 2, c = document.createElement('canvas');
    c.width = Math.ceil(img.naturalWidth * scale); c.height = Math.ceil(img.naturalHeight * scale);
    const g = c.getContext('2d'); g.scale(scale, scale); g.drawImage(img, 0, 0);
    data = await new Promise((res) => c.toBlob(res, 'image/png'));
    if (!data) throw new Error('画像を作れませんでした');
  }
  const existed = await exists(dir.handle, name);
  await writeFile(await dir.handle.getFileHandle(name, { create: true }), data);
  await reloadTree();
  toast(`${name} を${existed ? '上書きして' : ''}書き出しました`);
}

  closeTab: { label: 'タブを閉じる', key: { alt: 1, code: 'KeyW' }, run: guard(async () => { if (state.active) await closeTab(state.active); }) },
};
function selectedNodes() { const t = state.active; return t && t.doc ? t.doc.nodes.filter((n) => t.sel.has(n.id)) : []; }
const KEY_LABEL = { Backslash: '\\', Slash: '/', Minus: '-', Equal: '+', Digit0: '0', BracketLeft: '[', BracketRight: ']' };
function keyText(k) {
  if (!k) return '';
  const main = KEY_LABEL[k.code] || k.code.replace('Key', '');
  if (isMac) return (k.alt ? '⌥' : '') + (k.shift ? '⇧' : '') + (k.mod ? '⌘' : '') + main;
  return [k.mod && 'Ctrl', k.alt && 'Alt', k.shift && 'Shift', main].filter(Boolean).join('+');
}
function openHelp() {
  const t = el('table', 'sc-table');
  const fixed = [['文字の編集', 'ダブルクリック / Enter'], ['線でつなぐ', '図形の縁の点からドラッグ'], ['複数選択', 'Shift+クリック / 範囲をドラッグ'], ['画面の移動', 'スクロール / Space+ドラッグ'], ['拡大・縮小', `${isMac ? '⌘' : 'Ctrl'}+スクロール`], ['少しずつ動かす', '矢印キー(Shift で10)'], ['コピー / 貼り付け / 切り取り', `${keyText({ mod: 1, code: 'KeyC' })} / ${keyText({ mod: 1, code: 'KeyV' })} / ${keyText({ mod: 1, code: 'KeyX' })}`], ['複製', keyText({ mod: 1, code: 'KeyD' })], ['すべて選択', keyText({ mod: 1, code: 'KeyA' })], ['削除', 'Delete / Backspace']];
  const rows = Object.values(commands).filter((c) => c.key || c.hint).map((c) => [c.label, c.key ? keyText(c.key) : c.hint]).concat(fixed);
  for (const [l, k] of rows) { const tr = el('tr'); tr.append(el('td', '', l)); const td = el('td'); td.append(el('kbd', '', k)); tr.append(td); t.append(tr); }
  const close = openModal({ title: 'ショートカット一覧', body: t, footer: [button('閉じる', 'primary', () => close(null))] });
}
function paintCommands() {
  for (const b of $$('[data-cmd]')) {
    const c = commands[b.dataset.cmd];
    const ic = b.dataset.cmd === 'theme' ? (state.theme === 'dark' ? 'sun' : 'moon') : c.icon;
    b.innerHTML = icon(ic) + (c.text ? `<span>${c.text}</span>` : '');
    const tip = c.key ? `${c.label}(${keyText(c.key)})` : c.hint ? `${c.label}(${c.hint})` : c.label;
    b.title = tip; b.setAttribute('aria-label', tip);
    b.disabled = c.enabled ? !c.enabled() : false;
    b.classList.toggle('on', !!(c.active && c.active()));
  }
}
/**
 * ショートカットの判定。
 * - 記号のキーは配列(日本語配列など)で位置が違うため、入力された文字で照合する
 * - IME がオンの Windows では key が "Process" になることがあるため、そのときはキーの位置(code)で照合する
 */
const KEY_CHARS = { Backslash: ['\\', '¥', '_', '|'], Slash: ['/', '?'], Minus: ['-'], Equal: ['=', '+', ';'], BracketLeft: ['[', '{'], BracketRight: [']', '}'], Digit0: ['0'] };
function keyMatches(k, e) {
  const mod = isMac ? e.metaKey : e.ctrlKey;
  if (!!k.mod !== mod || !!k.alt !== e.altKey || (!k.anyShift && !!k.shift !== e.shiftKey)) return false;
  const chars = KEY_CHARS[k.code];
  if (chars && e.key && e.key.length === 1) return chars.includes(e.key);
  return e.code === k.code;
}
/** 入力中の変換は邪魔しない。ただし修飾キー付きなら、IME がオンでもショートカットとして扱う */
const imeBusy = (e) => e.isComposing || (e.keyCode === 229 && !(e.ctrlKey || e.metaKey || e.altKey));
function onGlobalKey(e) {
  if (imeBusy(e) || state.modal || !editorEl.hidden) return;
  if (e.target.closest && e.target.closest('#props input, #props select') && e.code !== 'KeyS') return; // 入力欄では文字の取り消しなどを優先する
  const mod = isMac ? e.metaKey : e.ctrlKey;
  if (mod && !e.altKey && e.code === 'KeyY') { e.preventDefault(); commands.redo.run(); return; }
  for (const c of Object.values(commands)) {
    if (c.key && keyMatches(c.key, e)) { e.preventDefault(); e.stopPropagation(); c.run(); return; }
  }
}

/* ---------- 起動 ---------- */
async function boot() {
  document.documentElement.dataset.theme = state.theme;
  $('#refresh').innerHTML = icon('refresh');
  $('#refresh').onclick = guard(async () => { if (state.root) { await reloadTree(); toast('再読み込みしました'); } });
  $('#empty').innerHTML = '<h1>Diagram Studio</h1><p>フローチャート、システム構成図、自由な図を描けます。フォルダを開き、右クリックの「新しい図」から作成してください。データはこの PC の中だけで扱い、外部へは送信しません。</p>';
  for (const b of $$('[data-cmd]')) b.addEventListener('click', () => commands[b.dataset.cmd].run());
  initPalette(); initCanvas(); initTree(); initResizer();
  document.addEventListener('keydown', onGlobalKey, true);
  window.addEventListener('beforeunload', (e) => { if (state.tabs.some((t) => t.dirty)) { e.preventDefault(); e.returnValue = ''; } });
  renderTree(); renderTabs(); renderCanvas();
  if (hasFsApi) {
    const saved = await idb('readonly', (s) => s.get('root')).catch(() => null);
    if (saved && await saved.queryPermission({ mode: 'readwrite' }) === 'granted') await guard(setRoot)(saved);
  }
}
boot();
})();
</script>
</body>

<!doctype html>
<html lang="ja">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Studio</title>
<style id="appcss">
[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f5f7;--panel:#ffffff;--panel2:#eceef2;--line:#dcdfe6;--text:#1f2430;--muted:#667085;
  --accent:#2f6f6a;--accent-soft:#dcefed;--danger:#b42318;--hover:#e6e8ee;--mark:#ffe58a;--mark-text:#1f2430;
  --code-bg:#f5f6f8;--quote:#b9c0cc;
  --hl-kw:#a0307e;--hl-str:#2a7a3b;--hl-num:#a65a00;--hl-com:#7a8291;--hl-fn:#2457a6;--hl-type:#0f7680;--hl-var:#9a3d3d;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181e;--panel:#1c2027;--panel2:#242933;--line:#323844;--text:#e3e6ec;--muted:#98a1b2;
  --accent:#6cc3b9;--accent-soft:#1f3d3a;--danger:#f97066;--hover:#2b313c;--mark:#7a6210;--mark-text:#fff4c9;
  --code-bg:#20252d;--quote:#4a5364;
  --hl-kw:#e38ad0;--hl-str:#8fd694;--hl-num:#eeb36a;--hl-com:#7f899b;--hl-fn:#86b4f5;--hl-type:#67d1d8;--hl-var:#ee9a9a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  display:grid;grid-template-rows:44px minmax(0,1fr);
}
button{font:inherit;color:inherit}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* ヘッダー */
header{display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:700;letter-spacing:.01em;margin:0 12px 0 6px;white-space:nowrap}
.brand b{color:var(--accent);font-weight:700}
.tb{height:32px;min-width:32px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb:focus-visible,.btn:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 5px;flex:none}
.grow{flex:1}

/* 本体レイアウト */
main{display:flex;min-height:0;min-width:0}
#sidebar{width:var(--sidebar-w,270px);flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
body.no-sidebar #sidebar,body.no-sidebar #resizer{display:none}
#resizer{width:5px;flex:none;cursor:col-resize;background:var(--line);background-clip:content-box;padding:0 2px}
#resizer:hover,#resizer.drag{background:var(--accent);padding:0 1px}
.side-head{height:34px;display:flex;align-items:center;gap:2px;padding:0 6px 0 12px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line)}
.side-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .tb{height:26px;min-width:26px;padding:0}
#tree{flex:1;overflow:auto;padding:4px 0 24px;min-height:0;user-select:none}
#tree.drop-root{box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:flex;align-items:center;gap:5px;height:26px;padding-right:8px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft);color:var(--accent)}
.row.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.row .tw{width:14px;display:flex;justify-content:center;color:var(--muted)}
.row .tw svg{width:12px;height:12px;transition:transform .1s}
.row.open .tw svg{transform:rotate(90deg)}
.row svg.i{width:15px;height:15px}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.ic-dir{color:#c99a2e}.ic-md{color:#3f86c9}.ic-img{color:#b3599f}.ic-file{color:var(--muted)}
.side-empty{padding:18px 14px;color:var(--muted)}

/* ワークスペース */
#workspace{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;height:34px;flex:none;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;max-width:220px;border-right:1px solid var(--line);cursor:pointer;color:var(--muted);flex:none}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.tab.dirty .dot{visibility:visible}
.tab .x{width:20px;height:20px;padding:0;border:0;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit}
.tab .x:hover{background:var(--hover)}
.tab .x svg{width:12px;height:12px}
#panes{flex:1;display:flex;min-height:0;min-width:0}
#editorPane{flex:1 1 50%;min-width:0;display:flex;background:var(--panel);border-right:1px solid var(--line);position:relative}
#previewPane{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
[hidden]{display:none!important}
body.read #editorPane{display:none}
body.no-editor #editorPane{display:none}
#gutter{width:52px;flex:none;overflow:hidden;background:var(--panel2);color:var(--muted);text-align:right;user-select:none;font:13px/22px ui-monospace,Menlo,Consolas,monospace}
#gutterIn{padding:12px 0;will-change:transform}
#gutterIn div{padding-right:10px;overflow:hidden}
#gutterIn div.cur{color:var(--text);font-weight:700}
#stack{flex:1;min-width:0;position:relative}
.ed,#mirror{
  font:14px/22px "BIZ UDGothic","MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP",ui-monospace,Menlo,Consolas,monospace;
  padding:12px 16px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;
}
.ed{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;resize:none;outline:0;overflow-y:scroll;background:var(--panel);color:var(--text)}
.ed::selection{background:var(--accent-soft)}
[data-theme="dark"] .ed::selection{background:#35605b}
#mirror{position:absolute;left:-99999px;top:0;visibility:hidden;padding:0}
#preview{flex:1;overflow:auto;padding:28px 36px;min-width:0;min-height:0}
.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.placeholder h1{margin:0;font-size:22px;color:var(--text)}
.placeholder p{margin:0;max-width:440px}
.image-view{display:flex;align-items:center;justify-content:center;min-height:100%}
.image-view img{max-width:100%;max-height:100%}

/* プレビュー。文書は Shadow DOM の中に描くので、ここではアプリ側の枠だけを定める */
#notes{padding:5px 14px;font-size:12px;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line)}
#pageHost{min-height:100%}
#preview.page{padding:0;background:#fff}
pre.plain{margin:0;font:13px/1.6 ui-monospace,Menlo,Consolas,"BIZ UDGothic",monospace;white-space:pre-wrap;overflow-wrap:anywhere}

/* メニュー・モーダル・通知 */
#ctx{position:fixed;z-index:40;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#ctx button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:0;border-radius:4px;background:none;cursor:pointer;text-align:left}
#ctx button:hover{background:var(--hover)}
#ctx button.danger{color:var(--danger)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(430px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%);height:76vh}
.modal h2{font-size:15px;margin:0;padding:14px 18px 10px}
.modal .mb{padding:2px 18px 12px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.modal .mf{padding:10px 18px 14px;display:flex;justify-content:flex-end;gap:8px}
.modal label{color:var(--muted);font-size:12px}
.modal input[type=text]{width:100%;height:34px;padding:0 10px;font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;outline:0}
.modal input[type=text]:focus{border-color:var(--accent)}
.btn{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.sr-file{margin-top:8px}
.sr-name{font-weight:700;padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.sr-hit{display:flex;gap:10px;width:100%;padding:4px 6px;border:0;background:none;text-align:left;cursor:pointer;border-radius:4px}
.sr-hit:hover,.sr-hit:focus-visible{background:var(--hover);outline:0}
.sr-hit .ln{color:var(--muted);min-width:34px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.sr-hit .tx{overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,"BIZ UDGothic",monospace;font-size:12px}
mark{background:var(--mark);color:var(--mark-text);border-radius:2px;padding:0 1px}
.sc-table{width:100%;border-collapse:collapse}
.sc-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.sc-table td:last-child{text-align:right;white-space:nowrap}
kbd{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--text);color:var(--panel);padding:7px 14px;border-radius:7px;max-width:70vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast div.err{background:var(--danger);color:#fff}

/* PDF は Shadow DOM の中で組むので、ステージは画面外に置くだけ */
#pdfStage{position:fixed;left:-99999px;top:0}
#busy{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.5);color:#fff;font-size:15px}
</style>
</head>
<body>
<header>
  <div class="brand">HTML <b>Studio</b></div>
  <button class="tb" data-cmd="sidebar"></button>
  <button class="tb" data-cmd="openFolder"></button>
  <button class="tb" data-cmd="save"></button>
  <i class="sep"></i>
  <button class="tb" data-cmd="bold"></button>
  <button class="tb" data-cmd="link"></button>
  <button class="tb" data-cmd="image"></button>
  <button class="tb" data-cmd="table"></button>
  <i class="sep"></i>
  <button class="tb" data-cmd="formatHtml"></button>
  <button class="tb" data-cmd="comment"></button>
  <button class="tb" data-cmd="search"></button>
  <span class="grow"></span>
  <button class="tb" data-cmd="readMode"></button>
  <button class="tb" data-cmd="theme"></button>
  <button class="tb" data-cmd="pdf"></button>
  <button class="tb" data-cmd="help"></button>
</header>
<main>
  <aside id="sidebar">
    <div class="side-head"><span id="rootName">エクスプローラー</span><button class="tb" id="refresh" title="フォルダを再読み込み"></button></div>
    <div id="tree" tabindex="-1"></div>
  </aside>
  <div id="resizer" role="separator" aria-orientation="vertical" title="ドラッグで幅を変更"></div>
  <section id="workspace">
    <div id="tabs"></div>
    <div id="panes">
      <div id="editorPane"><div id="gutter"><div id="gutterIn"></div></div><div id="stack"><div id="mirror"></div></div></div>
      <div id="previewPane"><div id="notes" hidden></div><div id="preview"></div></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<div id="pdfStage" data-theme="light" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
'use strict';

/* CDN に接続できない、または内容が検証(SRI)に通らないと、ライブラリが読み込まれない */
const missingLibs = ['DOMPurify'].filter((n) => !window[n]);
if (missingLibs.length) {
  document.documentElement.dataset.theme = 'light';
  const p = document.createElement('div');
  p.className = 'placeholder';
  p.innerHTML = '<h1>HTML Studio</h1><p>ライブラリを読み込めませんでした。インターネット接続を確認して、再読み込みしてください。</p>';
  document.body.replaceChildren(p);
  return;
}

/* ---------- 基本ユーティリティ ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const store = {
  get(k, d) { try { const v = localStorage.getItem('hts.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hts.' + k, JSON.stringify(v)); } catch { /* 保存できなくても動作は続ける */ } },
};

const ICONS = {
  menu: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  folderOpen: '<path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/><path d="M3 19l2.4-8.5A2 2 0 0 1 7.3 9H21l-2.3 8.5a2 2 0 0 1-2 1.5H5a2 2 0 0 1-2-2V8"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  save: '<path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/>',
  bold: '<path d="M7 4h6.5a4 4 0 0 1 0 8H7zM7 12h7.5a4 4 0 0 1 0 8H7z"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.700l1-1"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.500" cy="9.500" r="1.700"/><path d="M21 16l-5-5L6 20"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
  align: '<path d="M4 6h16M4 12h16M4 18h16M9 3v18M15 3v18"/>',
  links: '<path d="M4 6h10M4 11h7M4 16h6"/><path d="M15 15a3 3 0 0 0 4.300 0l1-1a3 3 0 0 0-4.300-4.300l-.5.5"/><path d="M18 13a3 3 0 0 0-4.300 0l-1 1a3 3 0 0 0 4.300 4.300l.5-.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.800-3.800"/>',
  book: '<path d="M12 6c-2-1.500-5-2-9-2v15c4 0 7 .5 9 2 2-1.500 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v15"/>',
  moon: '<path d="M20 14.500A8.500 8.500 0 0 1 9.500 4 8.500 8.500 0 1 0 20 14.500z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>',
  pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9.500 14.500L12 17l2.500-2.500"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.500 9.200a2.600 2.600 0 0 1 5 .8c0 1.700-2.500 2.200-2.500 4M12 17.200v.1"/>',
  chevron: '<path d="M9 5l7 7-7 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.500-3.500L3 10M3 4v6h6M4 13a8 8 0 0 0 14.500 3.500L21 14M21 20v-6h-6"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  html: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M10 13l-2.500 2.500L10 18M14 13l2.500 2.500L14 18"/>',
  comment: '<path d="M4 5h16v11H9l-5 4z"/>',
  plusFile: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v5M9.500 14.500h5"/>',
  plusDir: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.500 13.500h5"/>',
  rename: '<path d="M4 20h4L19 9l-4-4L4 16zM13.500 6.500l4 4"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

function toast(msg, err) {
  const d = el('div', err ? 'err' : '', msg);
  $('#toast').append(d);
  setTimeout(() => d.remove(), err ? 6000 : 2800);
}
function fail(e) {
  console.error(e);
  const m = e && e.name === 'NotAllowedError' ? 'フォルダへのアクセス権限がありません。フォルダを開き直してください。' : (e && e.message) || String(e);
  toast('エラー: ' + m, true);
}
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { if (e && e.name === 'AbortError') return; fail(e); } };

/* ---------- モーダル ---------- */
function openModal({ title, body, footer, wide, onClose }) {
  const prev = document.activeElement;
  const ov = el('div', 'overlay');
  const m = el('div', 'modal' + (wide ? ' wide' : ''));
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  m.setAttribute('aria-label', title);
  const mb = el('div', 'mb');
  mb.append(...[].concat(body || []));
  m.append(el('h2', '', title), mb);
  if (footer) { const f = el('div', 'mf'); f.append(...footer); m.append(f); }
  ov.append(m);
  let closed = false;
  const close = (v) => {
    if (closed) return; closed = true;
    ov.remove(); document.removeEventListener('keydown', onKey, true);
    if (state.modal === close) state.modal = null;
    if (prev && prev.focus) prev.focus();
    onClose && onClose(v);
  };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(null); } };
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(null); });
  document.addEventListener('keydown', onKey, true);
  document.body.append(ov);
  state.modal = close;
  return close;
}
const button = (label, cls, onClick) => { const b = el('button', 'btn ' + (cls || ''), label); b.type = 'button'; b.onclick = onClick; return b; };

function ask({ title, label, value = '', placeholder = '', selectEnd }) {
  return new Promise((res) => {
    const inp = el('input'); inp.type = 'text'; inp.value = value; inp.placeholder = placeholder; inp.setAttribute('aria-label', label || title);
    let close;
    const ok = () => close(inp.value);

const VOID_TAGS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr']);
const INLINE_TAGS = new Set(['a', 'abbr', 'b', 'bdi', 'bdo', 'br', 'button', 'cite', 'code', 'data', 'dfn', 'em', 'i', 'img', 'input', 'kbd', 'label', 'mark', 'q', 's', 'samp', 'select', 'small', 'span', 'strong', 'sub', 'sup', 'time', 'u', 'var', 'wbr']);

/** 要素単位でページへ流し込む。分割できるのは表の行間、リスト項目間、ラッパーの子要素間のみ。
    ラッパーは入れ子になるので、ページをまたぐときは開いているラッパーを新しいページに作り直す */
function paginate(srcBody, srcHtml, stage) {
  const H = A4.contentH, pages = [], shells = [];
  const newPage = () => {
    const html = srcHtml.cloneNode(false), body = srcBody.cloneNode(false);
    html.append(body); stage.append(html); pages.push(html);
    return body;
  };
  let page = newPage(), target = page;
  const used = () => { const l = page.lastElementChild; return l ? l.getBoundingClientRect().bottom - page.getBoundingClientRect().top : 0; };
  const fits = () => used() <= H;
  /** まだ何も置いていないページか。開いたラッパーだけのページも空として扱う */
  const isFresh = () => {
    for (let n = page; ; n = n.firstElementChild) {
      if (n === target) return n.childElementCount === 0;
      if (n.childElementCount !== 1) return false;
    }
  };
  const nextPage = () => {
    const carry = [];
    while (target.lastElementChild && /^H[1-6]$/.test(target.lastElementChild.tagName) && target.childElementCount > (target === page ? 1 : 0)) { const h = target.lastElementChild; h.remove(); carry.unshift(h); }
    for (let n = target; n !== page && !n.childElementCount;) { const up = n.parentElement; n.remove(); n = up; } // 中身のないラッパーを残さない
    page = newPage(); target = page;
    for (const o of shells) { const c = o.cloneNode(false); target.append(c); target = c; }
    target.append(...carry);
  };
  const placeSlices = (node) => {
    target.append(node);
    const cs = getComputedStyle(node), lh = parseFloat(cs.lineHeight) || 20, pad = parseFloat(cs.paddingTop) || 0;
    const total = node.getBoundingClientRect().height;
    node.remove();
    let off = 0;
    while (off < total) {
      const room = H - used() - 10, lead = off === 0 ? pad : 0, n = Math.floor((room - lead) / lh);
      if (n < 2) { nextPage(); continue; }
      const sh = Math.min(lead + n * lh, total - off);
      const wrap = el('div', 'pdf-slice'); wrap.style.height = sh + 'px';
      const c = node.cloneNode(true); c.style.marginTop = -off + 'px'; c.style.marginBottom = '0';
      wrap.append(c); target.append(wrap);
      off += sh;
      if (off < total) nextPage();
    }
  };
  const placeUnits = (node) => {
    const isTable = node.tagName === 'TABLE';
    const body = isTable ? node.tBodies[0] : node;
    for (;;) {
      const head = node.cloneNode(false);
      let tgt = head;
      if (isTable) { if (node.tHead) head.append(node.tHead.cloneNode(true)); tgt = document.createElement('tbody'); head.append(tgt); }
      target.append(head);
      let moved = 0;
      while (body.firstElementChild) {
        const u = body.firstElementChild;
        tgt.append(u);
        if (!fits()) { body.prepend(u); break; }
        moved++;
      }
      if (!body.firstElementChild) return;
      if (node.tagName === 'OL') node.start = (node.start || 1) + moved;
      if (!moved) {
        head.remove();
        if (isFresh()) { // 1項目が1ページを超える場合だけ行単位で切る
          const u = body.firstElementChild; u.remove();
          const wrapper = node.cloneNode(false);
          if (isTable) { if (node.tHead) wrapper.append(node.tHead.cloneNode(true)); const tb = document.createElement('tbody'); tb.append(u); wrapper.append(tb); } else wrapper.append(u);
          placeSlices(wrapper);
          if (!body.firstElementChild) return;
        } else nextPage();
        continue;
      }
      nextPage();
    }
  };
  const place = (node) => {
    target.append(node);
    if (fits()) return;
    const height = node.getBoundingClientRect().height;
    node.remove();
    if ((node.tagName === 'TABLE' && node.tBodies[0]) || node.tagName === 'UL' || node.tagName === 'OL') { placeUnits(node); return; }
    if (isWrapper(node) && (height > H / 2 || isFresh())) { // 小さなカードなどは分割せず丸ごと次のページへ送る
      const shell = node.cloneNode(false), kids = [...node.children];
      target.append(shell); target = shell; shells.push(node);
      for (const k of kids) { k.remove(); place(k); }
      shells.pop();
      target = target.parentElement;
      return;
    }
    if (!isFresh()) nextPage();
    target.append(node);
    if (fits()) return;
    node.remove();
    placeSlices(node);
  };
  for (const node of [...srcBody.children]) { node.remove(); place(node); }
  srcHtml.remove();
  return pages;
}
async function pageToJpeg(body, no, total, css) {
  const sheet = el('div', 'pdf-sheet'); sheet.dataset.theme = 'light';
  sheet.append(body);
  if (total > 1) sheet.append(el('div', 'pdf-foot', `${no} / ${total}`));
  const xml = new XMLSerializer().serializeToString(sheet);
  const NS_SVG = 'http://www.w3.org/2000/svg', NS_XH = 'http://www.w3.org/1999/xhtml'; // XML 名前空間の識別子で通信はしない
  const svg = `<svg xmlns="${NS_SVG}" width="${A4.w}" height="${A4.h}"><foreignObject x="0" y="0" width="100%" height="100%"><div xmlns="${NS_XH}"><style>${css}</style>${xml}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = Math.round(A4.w * A4.scale); c.height = Math.round(A4.h * A4.scale);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
  if (!blob) throw new Error('ページ画像の生成に失敗しました');
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height };
}

/** JPEG をページに貼るだけの最小 PDF を組み立てる */
function buildPdf(images) {
  const enc = new TextEncoder(), parts = [], offsets = [];
  let pos = 0;
  const put = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const n = images.length, objCount = 2 + n * 3;
  put('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');
  const obj = (id, body) => { offsets[id] = pos; put(`${id} 0 obj\n`); body(); put('\nendobj\n'); };
  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => put(`<< /Type /Pages /Count ${n} /Kids [${images.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] >>`));
  images.forEach((img, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    const stream = `q ${A4.ptW} 0 0 ${A4.ptH} 0 0 cm /I Do Q`;
    obj(pid, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4.ptW} ${A4.ptH}] /Resources << /XObject << /I ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid, () => put(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`));
    obj(iid, () => {
      put(`<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>\nstream\n`);
      put(img.bytes); put('\nendstream');
    });
  });
  const xref = pos;
  let t = `xref\n0 ${objCount + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= objCount; i++) t += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  put(t + `trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

async function exportPdf() {
  const t = state.active;
  if (!t || t.kind !== 'text' || !HTML_RE.test(t.name)) { toast('HTML ファイルを開いてください', true); return; }
  const busy = el('div'); busy.id = 'busy'; busy.textContent = 'PDF を生成中…'; document.body.append(busy);
  const host = el('div'), stage = host.attachShadow({ mode: 'open' });
  $('#pdfStage').append(host);
  try {
    const built = await buildDoc(t.ta.value, t);
    built.outerClass = `pdf ${built.outerClass}`.trim();
    const { html, body } = mountDoc(stage, built);
    $('style', stage).textContent += `\n${PDF_CSS}`;
    await loadLocalMedia(stage);
    await Promise.all([...stage.querySelectorAll('img')].map(async (img) => {
      const p = img.dataset.local;
      try {
        if (p) img.setAttribute('src', await blobToDataUrl(await fileAt(p)));
        await img.decode();
      } catch { img.replaceWith(blockedBox(`画像を読み込めません: ${p || ''}`)); }
    }));
    const css = $('style', stage).textContent.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const pages = paginate(body, html, stage);
    const images = [];
    for (let i = 0; i < pages.length; i++) {
      busy.textContent = `PDF を生成中… ${i + 1} / ${pages.length}`;
      images.push(await pageToJpeg(pages[i], i + 1, pages.length, css));
    }
    const a = el('a'); a.href = URL.createObjectURL(buildPdf(images));
    a.download = t.name.replace(/\.[^.]+$/, '') + '.pdf';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(`PDF を出力しました(${pages.length} ページ)`);
  } finally { host.remove(); busy.remove(); }
}

/* ---------- 全文検索 ---------- */
const SEARCH_LIMIT = 1000;
async function searchFiles(query, onFile, isStale) {
  const q = query.toLowerCase();
  let hits = 0, truncated = false;
  for (const node of walkFiles()) {
    if (isStale()) return null;
    if (IMG_RE.test(node.name)) continue;
    const open = state.tabs.find((t) => t.path === node.path && t.ta);
    let text;
    if (open) text = open.ta.value;
    else {
      const f = await node.handle.getFile();
      if (f.size > TEXT_MAX) continue;
      const buf = await f.arrayBuffer();
      if (new Uint8Array(buf.slice(0, 8192)).includes(0)) continue;
      text = new TextDecoder().decode(buf);
    }
    const found = [];
    text.split(/\r?\n/).forEach((line, i) => {
      if (truncated) return;
      const lower = line.toLowerCase();
      for (let p = lower.indexOf(q); p >= 0; p = lower.indexOf(q, p + q.length)) {
        if (hits >= SEARCH_LIMIT) { truncated = true; return; }
        found.push({ line: i, column: p, text: line }); hits++;
      }
    });
    if (found.length) onFile(node, found);
    if (truncated) break;
  }
  return { hits, truncated };
}
function hitHtml(h, len) {
  const from = Math.max(0, h.column - 60), to = Math.min(h.text.length, h.column + len + 90);
  return (from ? '…' : '') + esc(h.text.slice(from, h.column)) + '<mark>' + esc(h.text.slice(h.column, h.column + len)) + '</mark>' + esc(h.text.slice(h.column + len, to)) + (to < h.text.length ? '…' : '');
}
function openSearch() {
  if (!state.root) { toast('フォルダを開いてください', true); return; }
  const inp = el('input'); inp.type = 'text'; inp.placeholder = 'キーワードを入力'; inp.setAttribute('aria-label', '検索キーワード');
  const info = el('label'); const list = el('div');
  let close, seq = 0;
  const run = guard(async () => {
    const id = ++seq, q = inp.value;
    list.textContent = ''; info.textContent = '';
    if (!q) return;
    info.textContent = '検索中…';
    const r = await searchFiles(q, (node, found) => {
      const box = el('div', 'sr-file');
      box.append(el('div', 'sr-name', `${node.path}(${found.length})`));
      for (const h of found) {
        const b = el('button', 'sr-hit'); b.type = 'button';
        b.innerHTML = `<span class="ln">${h.line + 1}</span><span class="tx">${hitHtml(h, q.length)}</span>`;
        b.onclick = guard(async () => { close(null); await openFile(node, { line: h.line, column: h.column, length: q.length }); });
        box.append(b);
      }
      list.append(box);
    }, () => id !== seq);
    if (r) info.textContent = r.hits ? `${r.hits} 件${r.truncated ? '(上限に達したため打ち切り)' : ''}` : '見つかりませんでした';
  });
  const later = debounce(run, 220);
  let composing = false;
  inp.addEventListener('compositionstart', () => { composing = true; });
  inp.addEventListener('compositionend', () => { composing = false; later(); });
  inp.addEventListener('input', () => { if (!composing) later(); });
  close = openModal({ title: '全文検索', body: [inp, info, list], wide: true });
  const sel = state.active && state.active.ta ? state.active.ta.value.slice(state.active.ta.selectionStart, state.active.ta.selectionEnd) : '';
  if (sel && !sel.includes('\n')) { inp.value = sel; run(); }
  inp.focus(); inp.select();
}

/* ---------- コマンド ---------- */
const activeText = () => {
  const t = state.active;
  if (t && t.ta) return t;
  toast('テキストファイルを開いてください', true);
  return null;
};
const onEditor = (fn) => guard(async () => { const t = activeText(); if (t) await fn(t.ta, t); });
function setTheme(th) {
  state.theme = th; store.set('theme', th);
  document.documentElement.dataset.theme = th;
  paintCommands();
  renderPreview();
}
function setRead(on) {
  state.read = on; document.body.classList.toggle('read', on);
  paintCommands();
  if (!on) { scheduleGutter(); if (state.active && state.active.ta) state.active.ta.focus(); }
}
const commands = {
  sidebar: { label: 'サイドバーの表示/非表示', icon: 'menu', key: { mod: 1, code: 'Backslash' }, run() { document.body.classList.toggle('no-sidebar'); scheduleGutter(); paintCommands(); } },
  openFolder: {
    label: 'フォルダを開く', icon: 'folderOpen', key: { mod: 1, code: 'KeyO' },
    run: guard(async () => {
      if (!hasFsApi) { toast('Chrome または Edge で開いてください', true); return; }
      const h = await window.showDirectoryPicker({ mode: 'readwrite' });
      if (await closeAllTabs()) await setRoot(h);
    }),
  },
  save: { label: '保存', icon: 'save', key: { mod: 1, code: 'KeyS' }, run: guard(async () => { const t = activeText(); if (t) await saveTab(t); }) },
  bold: {
    label: '太字', icon: 'bold', key: { mod: 1, code: 'KeyB' },
    run: onEditor((ta) => {
      const s = ta.value, a = ta.selectionStart, b = ta.selectionEnd, o = '<strong>', c = '</strong>';
      if (s.slice(a - o.length, a) === o && s.slice(b, b + c.length) === c) { replaceRange(ta, a - o.length, b + c.length, s.slice(a, b), a - o.length, b - o.length); return; }
      replaceRange(ta, a, b, o + s.slice(a, b) + c, a + o.length, b + o.length);
    }),
  },
  link: {
    label: 'リンク挿入', icon: 'link', key: { mod: 1, code: 'KeyK' },
    run: onEditor(async (ta) => {
      const a = ta.selectionStart, b = ta.selectionEnd, text = ta.value.slice(a, b);
      const url = await ask({ title: 'リンク挿入', label: `URL${text ? `(対象: ${text.slice(0, 30)})` : ''}`, value: 'https://' });
      if (!url || !url.trim()) { ta.focus(); return; }
      const label = text || 'リンク', open = `<a href="${esc(url.trim())}">`;
      replaceRange(ta, a, b, `${open}${label}</a>`, a + open.length, a + open.length + label.length);
    }),
  },
  image: {
    label: '画像挿入', icon: 'image', key: { alt: 1, code: 'KeyI' },
    run: onEditor(async (ta) => {
      const a = ta.selectionStart, b = ta.selectionEnd, alt = ta.value.slice(a, b);
      const url = await ask({ title: '画像挿入', label: '画像の URL またはファイルからの相対パス', placeholder: 'images/sample.png' });
      if (!url || !url.trim()) { ta.focus(); return; }
      replaceRange(ta, a, b, `<img src="${esc(url.trim())}" alt="${esc(alt)}">`);
    }),
  },
  table: {
    label: 'テーブル挿入', icon: 'table', key: { alt: 1, code: 'KeyT' },
    run: onEditor(async (ta) => {
      const v = await ask({ title: 'テーブル挿入', label: '行数,列数(行数は見出し行を除く)', value: '3,3' });
      if (v == null) { ta.focus(); return; }
      const size = parseTableSize(v);
      if (!size) { toast('「3,3」の形式で入力してください', true); ta.focus(); return; }
      const s = ta.value, a = ta.selectionStart, b = ta.selectionEnd, ls = lineStart(s, a);
      const indent = s.slice(ls, a).match(/^\s*/)[0], blank = !s.slice(ls, a).trim();
      const body = buildTable(size.rows, size.cols, indent);
      const text = blank ? body.slice(indent.length) : `\n${body}`;
      replaceRange(ta, a, b, text);
      const first = s.slice(0, a).length + text.indexOf('<th>') + 4;
      ta.setSelectionRange(first, first);
    }),
  },
  formatHtml: {
    label: 'HTML整形', icon: 'align', key: { alt: 1, code: 'KeyF' },
    run: onEditor((ta) => {
      if (replaceAllText(ta, formatHtml(ta.value))) toast('HTML を整形しました'); else toast('整形の必要はありません');
    }),
  },
  comment: {
    label: 'コメントの切り替え', icon: 'comment', key: { alt: 1, code: 'KeyC' },
    run: onEditor((ta) => {
      const s = ta.value, ls = lineStart(s, ta.selectionStart);
      let b = ta.selectionEnd; if (b > ta.selectionStart && s[b - 1] === '\n') b--;
      const le = lineEnd(s, b), block = s.slice(ls, le), indent = block.match(/^\s*/)[0];
      const m = block.match(/^(\s*)<!--\s?([\s\S]*?)\s?-->\s*$/);
      const next = m ? m[1] + m[2] : `${indent}<!-- ${block.trim()} -->`;
      replaceRange(ta, ls, le, next, ls, ls + next.length);
    }),
  },
  search: { label: '全文検索', icon: 'search', key: { mod: 1, shift: 1, code: 'KeyF' }, run: openSearch },
  readMode: { label: '閲覧モード切り替え', icon: 'book', key: { mod: 1, code: 'KeyE' }, active: () => state.read, run() { setRead(!state.read); } },
  theme: { label: 'テーマ切り替え', icon: 'moon', key: { alt: 1, code: 'KeyD' }, run() { setTheme(state.theme === 'dark' ? 'light' : 'dark'); } },
  pdf: { label: 'PDF出力', icon: 'pdf', text: 'PDF', key: { alt: 1, code: 'KeyP' }, run: guard(exportPdf) },
  help: { label: 'ショートカット一覧', icon: 'help', key: { mod: 1, code: 'Slash' }, run: openHelp },
  closeTab: { label: 'タブを閉じる', key: { alt: 1, code: 'KeyW' }, run: guard(async () => { if (state.active) await closeTab(state.active); }) },
};
const KEY_LABEL = { Backslash: '\\', Slash: '/' };
function keyText(k) {
  const main = KEY_LABEL[k.code] || k.code.replace('Key', '');
  if (isMac) return (k.alt ? '⌥' : '') + (k.shift ? '⇧' : '') + (k.mod ? '⌘' : '') + main;
  return [k.mod && 'Ctrl', k.alt && 'Alt', k.shift && 'Shift', main].filter(Boolean).join('+');
}
function openHelp() {
  const t = el('table', 'sc-table');
  const fixed = [['インデント追加', 'Tab'], ['インデント削除', 'Shift+Tab'], ['閉じタグの補完', '>'], ['字下げを保って改行', 'Enter'], ['画像の貼り付け', isMac ? '⌘V' : 'Ctrl+V']];
  const rows = Object.values(commands).filter((c) => c.key).map((c) => [c.label, keyText(c.key)]).concat(fixed);
  for (const [l, k] of rows) {
    const tr = el('tr'); tr.append(el('td', '', l));
    const td = el('td'); td.append(el('kbd', '', k)); tr.append(td); t.append(tr);
  }
  const close = openModal({ title: 'ショートカット一覧', body: t, footer: [button('閉じる', 'primary', () => close(null))] });
}
function paintCommands() {
  for (const b of $$('[data-cmd]')) {
    const c = commands[b.dataset.cmd];
    const ic = b.dataset.cmd === 'theme' ? (state.theme === 'dark' ? 'sun' : 'moon') : c.icon;
    b.innerHTML = icon(ic) + (c.text ? `<span>${c.text}</span>` : '');
    const tip = `${c.label}(${keyText(c.key)})`;
    b.title = tip; b.setAttribute('aria-label', tip);
    b.classList.toggle('on', !!(c.active && c.active()) || (b.dataset.cmd === 'sidebar' && !document.body.classList.contains('no-sidebar')));
  }
}
function onGlobalKey(e) {
  if (e.isComposing || e.keyCode === 229 || state.modal) return;
  const mod = isMac ? e.metaKey : e.ctrlKey;
  for (const c of Object.values(commands)) {
    const k = c.key; if (!k || k.code !== e.code) continue;
    if (!!k.mod === mod && !!k.alt === e.altKey && !!k.shift === e.shiftKey) { e.preventDefault(); e.stopPropagation(); c.run(); return; }
  }
}

/* ---------- 起動 ---------- */
async function boot() {
  document.documentElement.dataset.theme = state.theme;
  $('#refresh').innerHTML = icon('refresh');
  $('#refresh').onclick = guard(async () => { if (state.root) { clearImgCache(); await reloadTree(); renderPreview(); toast('再読み込みしました'); } });
  for (const b of $$('[data-cmd]')) b.addEventListener('click', () => commands[b.dataset.cmd].run());
  paintCommands();
  initTree(); initResizer();
  document.addEventListener('keydown', onGlobalKey, true);
  window.addEventListener('beforeunload', (e) => { if (state.tabs.some((t) => t.dirty)) { e.preventDefault(); e.returnValue = ''; } });
  new ResizeObserver(scheduleGutter).observe($('#stack'));
  renderTree(); renderPreview();
  if (hasFsApi) {
    const saved = await idb('readonly', (s) => s.get('root')).catch(() => null);
    if (saved && await saved.queryPermission({ mode: 'readwrite' }) === 'granted') await guard(setRoot)(saved);
  }
}
boot();
})();

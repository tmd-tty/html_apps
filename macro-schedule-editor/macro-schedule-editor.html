<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Schedule Editor</title>
<style>
:root{--left:320px;--month:72px;--row:38px;--head:30px}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1113;--panel:#221619;--head-1:#3d1f25;--head-2:#301a1f;--head-3:#261719;--group:#301c21;
  --line:#4d2f35;--grid:#352226;--fy-line:#85525b;--text:#f4e9ea;--muted:#bda5a9;--hover:#3d2529;
  --accent:#f0555f;--on-accent:#2a0609;--danger:#ff9186;--ok:#47cd89;--warn:#fdb022;
  --bar:#9c4450;--on-bar:#ffffff;--ms:#f2b84b;--bar-hi:#ff4a50;--on-bar-hi:#2a0406;--summary:#85606a;--now:rgba(240,85,95,.13);--now-head:#6a2730;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#fbf3f3;--panel:#ffffff;--head-1:#f1d6d9;--head-2:#f8e5e6;--head-3:#fdf5f5;--group:#fcecec;
  --line:#e6c7ca;--grid:#f4e4e5;--fy-line:#bb8a91;--text:#2b1a1c;--muted:#75555a;--hover:#fae9ea;
  --accent:#b81d2a;--on-accent:#ffffff;--danger:#a3161f;--ok:#067647;--warn:#b54708;
  --bar:#f0b4b8;--on-bar:#4a0f15;--ms:#8a5a00;--bar-hi:#c8102e;--on-bar-hi:#ffffff;--summary:#c99aa0;--now:rgba(184,29,42,.08);--now-head:#f5bcc0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden;
  font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
button,input,select{font:inherit;color:inherit}

/* ヘッダー */
header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0 14px 0 0;white-space:nowrap}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.grow{flex:1}
#status{display:flex;align-items:center;gap:7px;min-height:32px;padding:0 10px;border-radius:6px;color:var(--muted);min-width:0}
#status b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
#status i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
#status.dirty{color:var(--warn)}#status.dirty i{background:var(--warn)}
#status.saved{color:var(--ok)}#status.saved i{background:var(--ok)}
#status.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:var(--ok);color:var(--on-accent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){#status.flash{animation:none;outline:2px solid var(--ok)}}

/* ガント */
#gantt{flex:1;overflow:auto;min-height:0;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
col.c-left{width:var(--left)}col.c-month{width:var(--month)}
thead th{position:sticky;z-index:3;height:var(--head);padding:0;font-weight:700;text-align:left;white-space:nowrap;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
thead tr:nth-child(1) th{top:0;background:var(--head-1)}
thead tr:nth-child(2) th{top:var(--head);background:var(--head-2)}
thead tr:nth-child(3) th{top:calc(var(--head) * 2);background:var(--head-3);text-align:center;font-weight:400}
thead th.corner{left:0;z-index:5;padding:0 14px;vertical-align:middle;background:var(--head-1);border-right:2px solid var(--fy-line);color:var(--muted)}
thead th>span{position:sticky;left:calc(var(--left) + 8px);display:inline-block;padding:0 8px}
thead th.now{background:var(--now-head)!important;font-weight:700}
thead th.fy-start{border-left:1px solid var(--fy-line)}
tbody th{position:sticky;left:0;z-index:2;padding:0;font-weight:400;text-align:left;background:var(--panel);border-right:2px solid var(--fy-line);border-bottom:1px solid var(--grid)}
tbody td{position:relative;padding:0;height:var(--row);border-bottom:1px solid var(--grid);overflow:hidden;
  background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--month) - 1px),var(--grid) calc(var(--month) - 1px),var(--grid) var(--month))}
tr.group th,tr.group td{background-color:var(--group)}
tr.group th{font-weight:700}
tr.group .name{flex:0 1 auto;font-weight:700}
tr.group .count{color:var(--muted);font-weight:400;white-space:nowrap}
tbody th[draggable]{cursor:grab}
tr.dragging{opacity:.45}
tr.drop-before th,tr.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
tr.drop-after th,tr.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}
.cell{display:flex;align-items:center;gap:6px;height:calc(var(--row) - 1px);padding:0 10px 0 14px}
.cell.in{padding-left:32px}
.name{flex:1;min-width:0;border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name:hover{text-decoration:underline}
tr.hi .name{font-weight:700}
tr.hi .name::before{content:"★ ";color:var(--mark,var(--bar-hi))}
.period{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{position:absolute;right:4px;top:6px;display:flex;gap:1px;padding-left:8px;background:var(--panel);opacity:0}
tr.group .acts{background:var(--group)}
tr:hover .acts,.acts:focus-within{opacity:1}
tr:hover .period,.cell:has(.acts:focus-within) .period{visibility:hidden}
.act{width:24px;height:24px;flex:none;padding:0;border:0;border-radius:4px;background:none;color:var(--muted);cursor:pointer}
.act:hover:not(:disabled){background:var(--hover);color:var(--text)}
.act.del:hover{color:var(--danger)}
.act:disabled{opacity:.3;cursor:default}
@media (hover:none){.acts{opacity:1}.period{display:none}}
.today{position:absolute;top:0;bottom:0;background:var(--now)}
.fy{position:absolute;top:0;bottom:0;width:1px;background:var(--fy-line)}
.bar{position:absolute;top:7px;height:23px;padding:0 20px 0 9px;border:0;cursor:pointer;background:var(--bar);color:var(--on-bar);font-size:11px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
.bar:hover,.bar:focus-visible{filter:brightness(1.15);outline:0}
.bar{user-select:none;-webkit-user-select:none;cursor:grab}
.bar.moving{filter:brightness(1.25);z-index:1;cursor:grabbing}
.bar.hi{background:var(--bar-hi);color:var(--on-bar-hi)}
.ms{position:absolute;top:9px;width:19px;height:19px;padding:0;border:0;background:var(--ms);cursor:grab;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ms.hi{background:var(--bar-hi)}
.ms:hover,.ms:focus-visible{filter:brightness(1.15);outline:0}
.ms.moving{filter:brightness(1.25);cursor:grabbing}
.ms-label{position:absolute;top:0;line-height:calc(var(--row) - 1px);font-size:11px;white-space:nowrap;color:var(--muted);pointer-events:none}
tr.ms-row .name::before{content:"◆ ";color:var(--mark,var(--ms))}
tr.ms-row.hi .name::before{color:var(--mark,var(--bar-hi))}
.summary{position:absolute;top:calc(50% - 2px);height:4px;border-radius:2px;background:var(--summary)}
.empty{padding:34px 20px;text-align:left;color:var(--muted)}
.empty .btn{margin-top:10px}
tr.none th{padding:0;border-bottom:0}

/* ダイアログ */
dialog{width:min(430px,calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);box-shadow:0 18px 50px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,10,14,.55)}
dialog h2{font-size:15px;margin:0;padding:15px 18px 6px}
.fields{display:grid;gap:12px;padding:8px 18px 6px}
.fields label{display:grid;gap:4px;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields input[type=text],.fields input[type=month],.fields select{width:100%;height:34px;padding:0 9px;color:var(--text);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.kinds{display:flex;gap:18px}
.field-title{color:var(--muted);font-size:12px;margin-bottom:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:3px 2px}
.fields label.swatch{position:relative;display:block;width:24px;height:24px;cursor:pointer}
.swatch input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.swatch span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:10px;color:var(--muted)}
.swatch span.auto{border:1px dashed var(--muted)}
.swatch input:checked+span{outline:2px solid var(--text);outline-offset:2px}
.swatch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
label.check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px}
label.check input{width:16px;height:16px;margin:0;accent-color:var(--bar-hi)}
.error{min-height:20px;margin:0;padding:2px 18px 0;color:var(--danger);font-size:12px}
.msg{margin:0;padding:6px 18px 4px;overflow-wrap:anywhere}
.foot{display:flex;gap:8px;padding:10px 18px 15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;padding:8px 15px;border-radius:7px;background:var(--danger);color:#fff;max-width:80vw;box-shadow:0 6px 20px rgba(0,0,0,.35)}
[data-theme="dark"] #toast{color:#2a0603}
#toast:empty{display:none}
@media (max-width:640px){:root{--left:190px;--month:64px}.period{display:none}#status b{max-width:150px}}
</style>
</head>
<body>
<header>
  <h1>Macro Schedule Editor</h1>
  <button class="btn primary" id="add" type="button">タスク追加</button>
  <button class="btn" id="addMs" type="button">マイルストーン追加</button>
  <i class="sep"></i>
  <button class="btn" id="open" type="button" title="Ctrl / ⌘ + O">開く</button>
  <button class="btn" id="save" type="button" title="Ctrl / ⌘ + S">上書き保存</button>
  <button class="btn" id="saveAs" type="button" title="Ctrl / ⌘ + Shift + S">名前を付けて保存</button>
  <div id="status" role="status" aria-live="polite"><i></i><span id="statusText"></span></div>
  <span class="grow"></span>
  <button class="btn" id="pptx" type="button">PowerPoint出力</button>
  <button class="btn" id="theme" type="button"></button>
</header>
<div id="gantt" tabindex="0" aria-label="ガントチャート"></div>
<div id="toast" role="alert"></div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>

<dialog id="taskDlg" aria-labelledby="taskTitle">
  <h2 id="taskTitle"></h2>
  <div class="fields">
    <div class="kinds" role="radiogroup" aria-label="種類">
      <label class="check"><input id="kTask" type="radio" name="kind">タスク</label>
      <label class="check"><input id="kMs" type="radio" name="kind">マイルストーン</label>
    </div>
    <label>グループ<select id="fGroup"></select></label>
    <label id="fNewWrap" hidden>新しいグループ名<input id="fNew" type="text" maxlength="100"></label>
    <label><span id="fNameLabel"></span><input id="fName" type="text" maxlength="200"></label>
    <label id="fDateWrap">日付<input id="fDate" type="date"></label>
    <div class="two" id="fMonths">
      <label>開始月<input id="fStart" type="month" placeholder="2026-04"></label>
      <label>終了月<input id="fEnd" type="month" placeholder="2027-03"></label>
    </div>
    <div><div class="field-title" id="fColorLabel">色</div><div class="swatches" id="fColors" role="radiogroup" aria-labelledby="fColorLabel"></div></div>
    <label class="check"><input id="fHi" type="checkbox">強調表示する</label>
  </div>
  <p class="error" id="fError"></p>
  <div class="foot">
    <button class="btn danger" id="fDelete" type="button">削除</button>
    <span class="grow"></span>
    <button class="btn" id="fCancel" type="button">キャンセル</button>
    <button class="btn primary" id="fOk" type="button"></button>
  </div>
</dialog>

<dialog id="groupDlg" aria-labelledby="groupTitle">
  <h2 id="groupTitle">グループ名の変更</h2>
  <div class="fields"><label>グループ名<input id="gName" type="text" maxlength="100"></label></div>
  <p class="error" id="gError"></p>
  <div class="foot"><span class="grow"></span><button class="btn" id="gCancel" type="button">キャンセル</button><button class="btn primary" id="gOk" type="button">変更</button></div>
</dialog>

<dialog id="askDlg" aria-labelledby="askTitle">
  <h2 id="askTitle"></h2>
  <p class="msg" id="askMsg"></p>
  <div class="foot"><span class="grow"></span><button class="btn" id="askNo" type="button">キャンセル</button><button class="btn" id="askYes" type="button"></button></div>
</dialog>

<script>
(() => {
'use strict';

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const MIN_MONTHS = 15, MILESTONE_MARGIN = 2, YEAR_MIN = 1927, YEAR_MAX = 2199, APP = 'Macro Schedule Editor', VERSION = 2;
const hasFsApi = 'showSaveFilePicker' in window;
const store = {
  get(k) { try { return localStorage.getItem('mse.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('mse.' + k, v); } catch { /* 保存できなくても動作は続ける */ } },
};

/* state.tasks の順序がそのまま表示順になる。マイルストーンは type と date を持ち、start / end は日付の月 */
const state = { tasks: [], handle: null, fileName: null, mtime: null, dirty: false, editing: null, lastGroup: '', renaming: null, drag: null, barDrag: null };
const rowOf = new WeakMap(); // 行要素 → { task } または { group }

/* ---------- 年月 ---------- */
const toIndex = (ym) => { const [y, m] = ym.split('-').map(Number); return y * 12 + m - 1; };
const yearOf = (i) => Math.floor(i / 12);
const monthOf = (i) => i % 12 + 1;
const toYm = (i) => `${yearOf(i)}-${String(monthOf(i)).padStart(2, '0')}`;
const nowIndex = () => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); };
const fiscalYear = (i) => (monthOf(i) >= 4 ? yearOf(i) : yearOf(i) - 1);
/** 年度の名称。改元のあった年度は新元号の元年度として扱う */
function japaneseFiscal(y) {
  const [era, base] = y >= 2019 ? ['令和', 2018] : y >= 1989 ? ['平成', 1988] : ['昭和', 1925];
  const n = y - base;
  return `${era}${n === 1 ? '元' : n}年度`;
}
const isMilestone = (t) => t.type === 'milestone';
/* バーとマイルストーンの指定色。両テーマと PowerPoint で同じ色を使う */
const COLORS = {
  red: ['赤', 'D92D20'], orange: ['オレンジ', 'EF6C00'], yellow: ['黄', 'F2B705'], green: ['緑', '2E9E5B'], teal: ['青緑', '0E9AA7'],
  blue: ['青', '2A70C8'], indigo: ['藍', '4F5BD5'], purple: ['紫', '8E44C4'], pink: ['ピンク', 'E0529C'], gray: ['グレー', '7A8494'],
};
function luminance(hex) {
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
/** 背景色の上で読みやすいほうの文字色を返す */
function textOn(hex) {
  const l = luminance(hex), white = 1.05 / (l + 0.05), dark = (l + 0.05) / (luminance('1A1113') + 0.05);
  return white >= dark ? 'FFFFFF' : '1A1113';
}
const periodText = (t) => (t.date ? t.date.replaceAll('-', '/') : `${t.start.replace('-', '/')} – ${t.end.replace('-', '/')}`);
const daysIn = (i) => new Date(yearOf(i), monthOf(i), 0).getDate();
const toDate = (i, day) => `${toYm(i)}-${String(day).padStart(2, '0')}`;
/** 日付を月の列上の位置(月番号 + 月内の割合)に変換する */
function datePosition(date) {
  const i = toIndex(date.slice(0, 7));
  return i + (+date.slice(8) - 0.5) / daysIn(i);
}
function positionDate(pos) {
  const i = Math.max(YEAR_MIN * 12, Math.min(YEAR_MAX * 12 + 11, Math.floor(pos)));
  const day = Math.floor((pos - Math.floor(pos)) * daysIn(i)) + 1;
  return toDate(i, Math.max(1, Math.min(daysIn(i), day)));
}
function setDate(t, date) { t.date = date; t.start = t.end = date.slice(0, 7); }
const shortDate = (date) => `${+date.slice(5, 7)}/${+date.slice(8)}`;

function calendarRange() {
  const s = state.tasks.map((t) => toIndex(t.start)), e = state.tasks.map((t) => toIndex(t.end));
  const start = s.length ? Math.min(...s) : nowIndex();
  // マイルストーンは右に名前を描くので、暦の末尾に余白を取る
  const room = state.tasks.filter(isMilestone).map((t) => toIndex(t.date.slice(0, 7)) + MILESTONE_MARGIN);
  const end = Math.max(start + MIN_MONTHS - 1, ...e, ...room);
  return { start, count: end - start + 1 };
}
function groupNames() {
  const out = [];
  for (const t of state.tasks) if (t.group && !out.includes(t.group)) out.push(t.group);
  return out;
}

/* ---------- 描画 ---------- */
function headerCell(text, span, cls) {
  const th = el('th', cls);
  th.colSpan = span; th.title = text; th.scope = 'col';
  th.append(el('span', '', text));
  return th;
}
function spans(start, count, keyOf) {
  const out = [];
  for (let i = start; i < start + count; i++) {
    const k = keyOf(i), last = out[out.length - 1];
    if (last && last.key === k) last.span++; else out.push({ key: k, span: 1, first: i });
  }
  return out;
}
function track(start, count, width) {
  const td = el('td');
  td.colSpan = count;
  const today = nowIndex() - start;
  if (today >= 0 && today < count) { const d = el('div', 'today'); d.style.left = `calc(var(--month) * ${today})`; d.style.width = 'var(--month)'; td.append(d); }
  for (let i = start + 1; i < start + count; i++) {
    if (monthOf(i) === 4) { const d = el('div', 'fy'); d.style.left = `calc(var(--month) * ${i - start} - 1px)`; td.append(d); }
  }
  td.style.width = width;
  return td;
}
function placeMilestone(mark, label, t, first) {
  const x = datePosition(t.date) - first;
  mark.style.left = `max(2px, calc(var(--month) * ${x} - 9px))`;
  label.style.left = `max(25px, calc(var(--month) * ${x} + 14px))`;
  label.textContent = `${shortDate(t.date)} ${t.name}`;
}
function place(node, from, months, start) {
  node.style.left = `calc(var(--month) * ${from - start} + 3px)`;
  node.style.width = `calc(var(--month) * ${months} - 6px)`;
}
const barLabel = (s, e) => (e > s ? `${monthOf(s)}月〜${monthOf(e)}月` : '');
function actions(items) {
  const box = el('div', 'acts');
  for (const a of items) {
    const b = el('button', 'act ' + (a.cls || ''), a.text);
    b.type = 'button'; b.title = a.label; b.setAttribute('aria-label', a.label); b.disabled = !!a.disabled; b.onclick = a.run;
    box.append(b);
  }
  return box;
}
function taskRow(t, indented, start, count) {
  const tr = el('tr', [t.highlight ? 'hi' : '', isMilestone(t) ? 'ms-row' : ''].join(' ').trim());
  rowOf.set(tr, { task: t });
  const custom = t.color && COLORS[t.color][1];
  if (custom) tr.style.setProperty('--mark', `#${custom}`);
  const paint = (node) => { if (custom) { node.style.background = `#${custom}`; node.style.color = `#${textOn(custom)}`; } };
  const th = el('th'); th.scope = 'row'; th.draggable = true;
  const peers = state.tasks.filter((x) => x.group === t.group), at = peers.indexOf(t);
  const cell = el('div', 'cell' + (indented ? ' in' : ''));
  const name = el('button', 'name', t.name); name.type = 'button'; name.title = `${t.name}(クリックで編集)`;
  name.onclick = () => openTask(t);
  cell.append(name, el('span', 'period', periodText(t)), actions([
    { text: '▲', label: `${t.name} を上へ移動`, disabled: at === 0, run: () => mutate(() => moveTaskBeside(t, peers[at - 1], false)) },

/* ---------- 並べ替え ---------- */
/** 配列の並びを表示順(グループごと、最後にグループなし)にそろえる */

/* ---------- バーのドラッグ ---------- */
const EDGE = 14, IDX_MIN = YEAR_MIN * 12, IDX_MAX = YEAR_MAX * 12 + 11, SCROLL_ZONE = 30;

/** 中央は期間ごと移動し、端は開始月または終了月だけを変える。範囲は開始月 <= 終了月を保つ */
function draggedRange(d, delta) {

  if (d.mode === 'end') return [d.s0, Math.min(IDX_MAX, Math.max(d.e0 + delta, d.s0))];
  const k = Math.max(IDX_MIN - d.s0, Math.min(IDX_MAX - d.e0, delta));

    if (d.cancelled) return;

    if (ev.clientX > g.right - SCROLL_ZONE) box.scrollLeft += 16; else if (ev.clientX < left + SCROLL_ZONE) box.scrollLeft -= 16;

  const onKey = (ev) => {
    if (ev.key !== 'Escape' || d.cancelled) return;
    ev.preventDefault();
    Object.assign(d, { cancelled: true, moved: true });

    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    document.removeEventListener('keydown', onKey, true);
    // 直後のクリックで編集画面が開かないよう、クリックの処理が終わってから確定する
    setTimeout(() => { state.barDrag = null; if (d.moved && !d.cancelled) commit(); }, 0);
  };

  dragSession(e, (px) => {
    [ns, ne] = draggedRange(d, Math.round(px / W));

}
function initBarDrag() {
  const box = $('#gantt');

/* ---------- ファイル ---------- */
function serialize() {

    }

const PICKER = { types: [{ description: 'スケジュール (JSON)', accept: { 'application/json': ['.json'] } }] };
const suggestedName = () => state.fileName || 'macro-schedule.json';
function loaded(text, name, handle, mtime) {

}
async function confirmDiscard() {

}
async function openFile() {

function download() {
  const name = suggestedName();

  a.click();

async function writeTo(h) {

  await w.close();
  const f = await h.getFile();

async function saveAs() {

}
async function save() {
  if (!state.handle) { await saveAs(); return; }
  const h = state.handle;
  if (h.requestPermission && await h.requestPermission({ mode: 'readwrite' }) !== 'granted') { toast('ファイルへの書き込みが許可されませんでした'); return; }
  const f = await h.getFile();
  if (f.lastModified !== state.mtime && !await ask('ファイルが変更されています', `「${f.name}」は開いた後に他で変更されています。上書きすると、その変更は失われます。`, '上書き保存', true)) return;

const guard = (fn) => async (...a) => {
  try { await fn(...a); } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.error(e);
    toast(`エラー: ${(e && e.message) || e}`);
  }
};

/* ---------- PowerPoint 出力 ---------- */
/* ライブラリは押したときにだけ読み込むので、それ以外の操作では通信が発生しない */
const PPTX_URL = 'https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js';
const PPTX_SRI = 'sha384-qb0Xhi7LLYpvW1HCK6oMrmDLSY9sy7vwm6ZlV6KjtrlL9yg30+YN4neTwnmX+Kp8';
const SLIDE = {
  w: 13.333, h: 7.5, margin: 0.35, titleY: 0.22, top: 0.78, left: 3.0, head: 0.26, bottom: 0.35, rowMax: 0.4, rows: 20, font: 'Yu Gothic',
  ink: '2B1A1C', muted: '75555A', line: 'E6C7CA', grid: 'F4E4E5', fy: 'BB8A91', head1: 'F1D6D9', head2: 'F8E5E6', head3: 'FDF5F5',
  group: 'FCECEC', bar: 'F0B4B8', onBar: '4A0F15', hi: 'C8102E', onHi: 'FFFFFF', ms: '8A5A00', summary: 'C99AA0',
};
let pptxReady = null;
function loadPptx() {
  if (window.PptxGenJS) return Promise.resolve();
  pptxReady = pptxReady || new Promise((res, rej) => {
    const sc = el('script');
    sc.src = PPTX_URL; sc.integrity = PPTX_SRI; sc.crossOrigin = 'anonymous'; sc.referrerPolicy = 'no-referrer';
    sc.onload = res;
    sc.onerror = () => { sc.remove(); pptxReady = null; rej(new Error('PowerPoint 出力の部品を読み込めません。インターネット接続を確認してください')); };
    document.head.append(sc);
  });
  return pptxReady;
}
/** 文字幅を概算し、枠に収まらない文字列を省略する。正式名は図形の名前に残す */
function fitText(text, widthIn, pt) {
  const max = (widthIn * 72) / pt;
  let used = 0, out = '';
  for (const ch of text) {
    used += /[\x00-\xff]/.test(ch) ? 0.55 : 1;
    if (used > max) return out.slice(0, -1) + '…';
    out += ch;
  }
  return out;
}
const textWidth = (text, pt) => ([...text].reduce((a, c) => a + (/[\x00-\xff]/.test(c) ? 0.55 : 1), 0) * pt) / 72;
/** 表示順の行に展開し、スライドごとに分ける。見出しだけがページ末に残らないようにする */
function slideRows() {
  const rows = [];
  for (const g of groupNames()) {
    const list = state.tasks.filter((t) => t.group === g);
    rows.push({ group: g, tasks: list }, ...list.map((t) => ({ task: t, indented: true })));
  }
  rows.push(...state.tasks.filter((t) => !t.group).map((t) => ({ task: t })));
  const pages = [];
  for (let i = 0; i < rows.length;) {
    let n = Math.min(SLIDE.rows, rows.length - i);
    if (n > 1 && rows[i + n - 1].group != null && i + n < rows.length) n--;
    pages.push(rows.slice(i, i + n));
    i += n;
  }
  return pages;
}
function drawSlide(pres, slide, rows, page, pages, title, rowH) {
  const S = SLIDE, shapes = pres.shapes, { start, count } = calendarRange();
  const x0 = S.margin + S.left, mw = (S.w - S.margin * 2 - S.left) / count;
  const xOf = (i) => x0 + (i - start) * mw;
  const text = (t, o) => slide.addText(t, { fontFace: S.font, color: S.ink, margin: 0, valign: 'middle', lang: 'ja-JP', ...o });
  const cell = (t, x, y, w, fill, name, o = {}) => text(fitText(t, w - 0.06, o.fontSize || 9) === t ? t : '', {
    shape: shapes.RECTANGLE, x, y, w, h: S.head, fill: { color: fill }, line: { color: S.line, width: 0.5 }, fontSize: 9, align: 'center', objectName: name, ...o,
  });

  text(fitText(title, 9, 18), { x: S.margin, y: S.titleY, w: 9.4, h: 0.42, fontSize: 18, bold: true, objectName: 'タイトル' });
  const d = new Date();
  text(`作成日 ${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`, {
    x: S.w - S.margin - 3, y: S.titleY + 0.1, w: 3, h: 0.3, fontSize: 9, color: S.muted, align: 'right', objectName: '作成日',
  });
  if (pages > 1) text(`${page} / ${pages}`, { x: S.w - S.margin - 1, y: S.h - 0.32, w: 1, h: 0.22, fontSize: 8, color: S.muted, align: 'right', objectName: 'ページ番号' });

  const headH = S.head * 3;
  text('タスク', { shape: shapes.RECTANGLE, x: S.margin, y: S.top, w: S.left, h: headH, fill: { color: S.head1 }, line: { color: S.line, width: 0.5 }, fontSize: 9, bold: true, color: S.muted, align: 'left', margin: [6, 0, 0, 0], objectName: '見出し: タスク' });
  for (const sp of spans(start, count, fiscalYear)) {
    const name = japaneseFiscal(sp.key);
    cell(name, xOf(sp.first), S.top, sp.span * mw, S.head1, `年度: ${name}`, { bold: true });
  }
  for (const sp of spans(start, count, yearOf)) cell(`${sp.key}年`, xOf(sp.first), S.top + S.head, sp.span * mw, S.head2, `西暦: ${sp.key}年`, { bold: true });
  for (let i = start; i < start + count; i++) {
    const label = mw >= 0.32 ? `${monthOf(i)}月` : mw >= 0.17 ? String(monthOf(i)) : '';
    cell(label, xOf(i), S.top + S.head * 2, mw, S.head3, `月: ${yearOf(i)}年${monthOf(i)}月`, { fontSize: 8 });
  }

  const y0 = S.top + headH, bodyH = rows.length * rowH;
  rows.forEach((r, n) => {
    const y = y0 + n * rowH, name = r.group != null ? r.group : r.task.name;
    slide.addShape(shapes.RECTANGLE, { x: S.margin, y, w: S.w - S.margin * 2, h: rowH, fill: r.group != null ? { color: S.group } : { color: 'FFFFFF' }, line: { color: S.grid, width: 0.5 }, objectName: `行: ${name}` });
  });
  for (let i = start + 1; i < start + count; i++) {
    const fy = monthOf(i) === 4;
    if (!fy && mw < 0.17) continue;
    slide.addShape(shapes.LINE, { x: xOf(i), y: y0, w: 0, h: bodyH, line: { color: fy ? S.fy : S.grid, width: fy ? 0.75 : 0.5 }, objectName: `${fy ? '年度境界' : '月境界'}: ${yearOf(i)}年${monthOf(i)}月` });
  }
  slide.addShape(shapes.LINE, { x: x0, y: y0, w: 0, h: bodyH, line: { color: S.fy, width: 1 }, objectName: 'タスク列の境界' });

      return;
    }
    const t = r.task, ms = isMilestone(t), custom = t.color && COLORS[t.color][1];
    const color = custom || (t.highlight ? S.hi : ms ? S.ms : S.bar);
    const indent = r.indented ? 0.26 : 0.08, mark = ms ? '◆ ' : t.highlight ? '★ ' : '';
    text(fitText(mark + t.name, S.left - indent - 0.08, 9.5), { x: S.margin + indent, y, w: S.left - indent - 0.04, h: rowH, fontSize: 9.5, bold: t.highlight, objectName: `タスク名: ${t.name}` });
    if (ms) {
      const size = Math.min(0.22, rowH * 0.62), cx = xOf(0) + datePosition(t.date) * mw;
      const lx = Math.max(x0 + size / 2, cx);
      slide.addShape(shapes.DIAMOND, { x: lx - size / 2, y: y + (rowH - size) / 2, w: size, h: size, fill: { color }, line: { color, width: 0 }, objectName: `マイルストーン: ${t.name}` });
      const label = `${shortDate(t.date)} ${t.name}`, lw = Math.min(textWidth(label, 8) + 0.08, 3);
      const right = lx + size / 2 + 0.04 + lw <= S.w - S.margin;
      text(fitText(label, lw, 8), { x: right ? lx + size / 2 + 0.04 : lx - size / 2 - 0.04 - lw, y, w: lw, h: rowH, fontSize: 8, color: S.muted, align: right ? 'left' : 'right', objectName: `マイルストーン名: ${t.name}` });
      return;
    }
    const s = toIndex(t.start), months = toIndex(t.end) - s + 1, w = months * mw - 0.04;
    const label = barLabel(s, s + months - 1);

    if (label && textWidth(label, 8) + 0.3 < w) text(label, { ...o, fontSize: 8, bold: true, color: custom ? textOn(custom) : t.highlight ? S.onHi : S.onBar, align: 'center' });
    else slide.addShape(o.shape, o);

}
/** 調整値が空だとアプリによって先端の長さが幅に連動するので、高さの半分に固定する。
    ライブラリに指定方法がないため、生成後のスライドを書き換える */
async function fixArrowTips(data) {
  const zip = await window.JSZip.loadAsync(data);
  const slides = Object.keys(zip.files).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  for (const n of slides) {
    const xml = await zip.file(n).async('string');
    zip.file(n, xml.replaceAll('<a:prstGeom prst="homePlate"><a:avLst></a:avLst></a:prstGeom>', '<a:prstGeom prst="homePlate"><a:avLst><a:gd name="adj" fmla="val 50000"/></a:avLst></a:prstGeom>'));
  }
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}
async function exportPptx() {

  const btn = $('#pptx'), label = btn.textContent;

  try {
    await loadPptx();
    const pres = new window.PptxGenJS();
    const title = (state.fileName || 'スケジュール').replace(/\.json$/i, '');
    pres.layout = 'LAYOUT_WIDE'; pres.title = title; pres.author = APP; pres.company = ''; pres.subject = '大日程';
    pres.theme = { headFontFace: SLIDE.font, bodyFontFace: SLIDE.font };
    const pages = slideRows();
    // 行が少なければ高さを広げてスライドを埋める。全スライドで同じ高さにそろえる
    const body = SLIDE.h - SLIDE.top - SLIDE.head * 3 - SLIDE.bottom;
    const rowH = Math.min(SLIDE.rowMax, body / Math.max(...pages.map((r) => r.length)));
    pages.forEach((rows, i) => drawSlide(pres, pres.addSlide(), rows, i + 1, pages.length, title, rowH));

    const a = el('a'); a.href = URL.createObjectURL(blob); a.download = `${title}.pptx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    showStatus('saved', `${a.download} を出力しました(${pages.length} スライド)`);
    const s = $('#status'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
    setTimeout(refreshStatus, 5000);
  } finally { btn.disabled = false; btn.textContent = label; }
}
